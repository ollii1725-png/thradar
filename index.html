<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ภาพเรดาร์ทั่วประเทศ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

    <!-- Header Bar แบบเว็บปริมาณน้ำในเขื่อน -->
    <header class="bg-gradient-to-r from-blue-700 via-blue-600 to-cyan-600 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
            
            <!-- Logo & Title -->
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 bg-white/20 backdrop-blur-md rounded-2xl flex items-center justify-center shadow-inner border border-white/30">
                    <i class="fa-solid fa-cloud-showers-heavy text-white text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-white leading-tight">
                        ภาพเรดาร์ตรวจอากาศฝนหลวง
                    </h1>
                    <p class="text-xs text-blue-100 font-light opacity-90">
                        Thailand Royal Rainmaking Radar Tracker by Sumet Prapasathit
                    </p>
                </div>
            </div>

            <!-- Header Badges & Actions -->
            <div class="flex items-center gap-3">
                <div class="hidden sm:flex items-center gap-2 bg-black/20 backdrop-blur-md border border-white/20 text-xs px-3 py-1.5 rounded-full font-medium">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span>ข้อมูลจริง กรมฝนหลวงฯ</span>
                </div>

                <div class="flex items-center gap-1.5 bg-white/10 p-1 rounded-xl border border-white/20">
                    <button id="viewSingleBtn" onclick="switchView('single')" class="px-3 py-1.5 bg-white text-blue-700 text-xs font-semibold rounded-lg shadow-sm transition">
                        <i class="fa-solid fa-circle-play mr-1"></i> โหมดสไลด์/วิดีโอ
                    </button>
                    <button id="viewGridBtn" onclick="switchView('grid')" class="px-3 py-1.5 text-white hover:bg-white/10 text-xs font-medium rounded-lg transition">
                        <i class="fa-solid fa-border-all mr-1"></i> โหมดตารางกริด
                    </button>
                </div>
            </div>

        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">

        <!-- Controls Section Card -->
        <div class="bg-white rounded-2xl p-4 md:p-5 border border-slate-200/80 mb-6 shadow-sm">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-center">
                
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1.5">
                        <i class="fa-solid fa-tower-cell text-blue-600 mr-1"></i> เลือกสถานีเรดาร์
                    </label>
                    <select id="stationSelect" onchange="onStationChange()" class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-xl px-3.5 py-2.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
                        <option value="sattahip">สถานีสัตหีบ (ชลบุรี)</option>
                        <option value="omkoi">สถานีอมก๋อย (เชียงใหม่)</option>
                        <option value="phnom">สถานีพนม (สุราษฎร์ธานี)</option>
                        <option value="takli">สถานีตาคลี (นครสวรรค์)</option>
                        <option value="phimai">สถานีพิมาย (นครราชสีมา)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1.5">
                        <i class="fa-regular fa-calendar-days text-blue-600 mr-1"></i> เลือกวันที่ดูย้อนหลัง
                    </label>
                    <input type="date" id="datePicker" onchange="loadRadarData()" class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-xl px-3.5 py-2.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
                </div>

                <div class="flex items-end h-full pt-2 md:pt-0">
                    <button id="latestBtn" class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold py-2.5 px-4 rounded-xl text-sm transition flex items-center justify-center gap-2 shadow-sm shadow-blue-200">
                        <i class="fa-solid fa-bolt text-amber-300"></i> ดูภาพปัจจุบัน (Direct Real-time)
                    </button>
                </div>

            </div>
        </div>

        <!-- Notice Alert -->
        <div class="bg-blue-50/70 border border-blue-100 rounded-xl p-3 mb-6 flex items-center gap-2.5 text-xs text-blue-800">
            <i class="fa-solid fa-circle-info text-blue-600 text-sm flex-shrink-0"></i>
            <span>โหมดภาพปัจจุบันจะคำนวณและดึงไฟล์ตรงจากกรมฝนหลวงฯ ณ วินาทีนั้น ส่วนโหมดย้อนหลังจะดึงคลังภาพสะสม 24 ชม. ล่าสุด</span>
        </div>

        <!-- Single View Container -->
        <div id="singleViewContainer" class="space-y-4">
            
            <!-- Radar Display Box -->
            <div class="bg-slate-900 border border-slate-200 rounded-2xl p-2 relative flex items-center justify-center min-h-[420px] shadow-sm overflow-hidden">
                
                <!-- Loading Spinner -->
                <div id="loadingSpinner" class="absolute inset-0 bg-white/90 z-10 flex flex-col items-center justify-center gap-2 backdrop-blur-sm">
                    <i class="fa-solid fa-circle-notch fa-spin text-blue-600 text-3xl"></i>
                    <span class="text-xs font-semibold text-slate-600">กำลังประมวลผลภาพเรดาร์...</span>
                </div>

                <img id="radarImg" src="" alt="Radar Display" class="max-h-[600px] w-auto object-contain rounded-lg shadow-inner">
            </div>

            <!-- Control Bar Card -->
            <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-sm flex flex-col gap-3">
                
                <div class="flex items-center justify-between text-xs text-slate-500 font-mono">
                    <span id="timeDisplay" class="font-bold text-slate-700 text-sm">กำลังโหลดข้อมูล...</span>
                    <span id="frameCounter" class="bg-slate-100 px-2.5 py-1 rounded-md text-slate-600 font-semibold">0 / 0</span>
                </div>

                <input type="range" id="timelineSlider" min="0" max="0" value="0" oninput="onSliderChange(this.value)" class="w-full accent-blue-600 cursor-pointer h-2 bg-slate-100 rounded-lg">

                <div class="flex flex-wrap items-center justify-center gap-3 pt-1">
                    <button id="prevBtn" onclick="prevImage()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-sm font-semibold transition disabled:opacity-40">
                        <i class="fa-solid fa-chevron-left mr-1"></i> ย้อนหลัง
                    </button>
                    
                    <button id="playBtn" onclick="togglePlayLoop()" class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-semibold transition flex items-center gap-2 shadow-sm shadow-blue-200">
                        <i id="playIcon" class="fa-solid fa-play"></i> <span id="playText">เล่นวิดีโอ Loop ย้อนหลัง</span>
                    </button>

                    <button id="nextBtn" onclick="nextImage()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-sm font-semibold transition disabled:opacity-40">
                        ถัดไป <i class="fa-solid fa-chevron-right ml-1"></i>
                    </button>
                </div>

            </div>

        </div>

        <!-- Grid View Container -->
        <div id="gridViewContainer" class="hidden">
            <div id="gridGallery" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                <!-- JS will render grid items here -->
            </div>
        </div>

    </main>

    <script>
        // กำหนดข้อความต่อท้ายไฟล์ (Suffix Pattern) ตามจริงของแต่ละสถานี
        const STATION_PATTERNS = {
            sattahip: "0300dBZ.cappi.png",
            omkoi:    "0200dBZ.cappi.png",
            phnom:    "0300dBZ.cappi.png",
            takli:    "0400dBZ.cappi.png",
            phimai:   "0400dBZ.cappi.png"
        };
        
        let radarImages = [];
        let currentIndex = 0;
        let isPlaying = false;
        let playInterval = null;

        // ฟังก์ชันโหลดข้อมูลภาพย้อนหลังสำหรับ Slider และ Grid
        async function loadRadarData() {
            const station = document.getElementById('stationSelect').value;
            const selectedDate = document.getElementById('datePicker').value;
            const [year, month, day] = selectedDate.split('-');
            const spinner = document.getElementById('loadingSpinner');
            if (spinner) spinner.style.display = 'flex';

            const username = window.location.hostname.split('.')[0] || "ollii1725-png";
            const dataRepo = `thradar-data-${station}`;
            const apiUrl = `https://api.github.com/repos/${username}/${dataRepo}/contents/radar-images/${station}/${year}/${month}/${day}`;

            try {
                const res = await fetch(apiUrl);
                if (res.ok) {
                    const data = await res.json();
                    radarImages = data
                        .filter(file => file.name.endsWith('.png'))
                        .map(file => ({ filename: file.name, url: file.download_url }));
                } else {
                    radarImages = [];
                }
            } catch (e) {
                radarImages = [];
            }

            if (radarImages.length === 0) {
                document.getElementById('timeDisplay').innerText = "ไม่พบภาพในวันที่เลือก";
                if (spinner) spinner.style.display = 'none';
                document.getElementById('gridGallery').innerHTML = '<p class="col-span-full text-center text-sm text-slate-400 py-10 bg-white rounded-2xl border border-slate-200">ไม่มีข้อมูลภาพเรดาร์ในระบบประจำวันที่เลือก</p>';
                document.getElementById('prevBtn').disabled = true;
                document.getElementById('nextBtn').disabled = true;
                return;
            }

            document.getElementById('timelineSlider').max = radarImages.length - 1;
            currentIndex = radarImages.length - 1;
            updateSingleDisplay(currentIndex);
            renderGridView();
        }

        // ฟังก์ชันคำนวณและดึงภาพ Real-time ล่าสุดตรงจากชื่อไฟล์
        async function fetchRealtimeLatestImage() {
            if (isPlaying) togglePlayLoop();
            const station = document.getElementById('stationSelect').value;
            const spinner = document.getElementById('loadingSpinner');
            if (spinner) spinner.style.display = 'flex';

            const suffix = STATION_PATTERNS[station] || "0300dBZ.cappi.png";

            // 1. คำนวณเวลา UTC ปัจจุบัน ย้อนเผื่อระบบต้นทางประมวลผล 3 นาที
            const now = new Date();
            now.setMinutes(now.getMinutes() - 3);

            // 2. ปัดนาทีเป็นทวีคูณของ 6
            const currentMinutes = now.getUTCMinutes();
            const roundedMinutes = Math.floor(currentMinutes / 6) * 6;

            // 3. ฟอร์แมต YYYYMMDD และ HHMM
            const year = now.getUTCFullYear();
            const month = String(now.getUTCMonth() + 1).padStart(2, '0');
            const day = String(now.getUTCDate()).padStart(2, '0');
            const hours = String(now.getUTCHours()).padStart(2, '0');
            const minutes = String(roundedMinutes).padStart(2, '0');

            const filename = `${year}${month}${day}${hours}${minutes}${suffix}`;
            const directImageUrl = `https://file.royalrain.go.th/opendata/radar_data/cappi/${station}/${filename}`;

            // 4. ทดสอบโหลดภาพ
            const imgTester = new Image();
            imgTester.onload = function() {
                document.getElementById('radarImg').src = directImageUrl;
                document.getElementById('timeDisplay').innerHTML = `<span class="text-emerald-600 font-bold"><i class="fa-solid fa-circle text-[10px] text-emerald-500 mr-1"></i> [Real-time ล่าสุด]</span> ${filename}`;
                if (spinner) spinner.style.display = 'none';
            };
            
            imgTester.onerror = function() {
                // ถ้ารอบล่าสุดยังไม่พร้อม ให้ถอยกลับไปอีก 6 นาที
                now.setMinutes(now.getMinutes() - 6);
                const prevMinutes = String(Math.floor(now.getUTCMinutes() / 6) * 6).padStart(2, '0');
                const prevHours = String(now.getUTCHours()).padStart(2, '0');
                const prevFilename = `${year}${month}${day}${prevHours}${prevMinutes}${suffix}`;
                const prevImageUrl = `https://file.royalrain.go.th/opendata/radar_data/cappi/${station}/${prevFilename}`;

                document.getElementById('radarImg').src = prevImageUrl;
                document.getElementById('timeDisplay').innerHTML = `<span class="text-emerald-600 font-bold"><i class="fa-solid fa-circle text-[10px] text-emerald-500 mr-1"></i> [Real-time ล่าสุด]</span> ${prevFilename}`;
                if (spinner) spinner.style.display = 'none';
            };

            imgTester.src = directImageUrl;
        }

        function onStationChange() {
            loadRadarData();
            fetchRealtimeLatestImage();
        }

        function updateSingleDisplay(index) {
            currentIndex = parseInt(index);
            const item = radarImages[currentIndex];
            document.getElementById('radarImg').src = item.url;
            document.getElementById('timeDisplay').innerText = item.filename;
            document.getElementById('frameCounter').innerText = `${currentIndex + 1} / ${radarImages.length}`;
            document.getElementById('timelineSlider').value = currentIndex;
            
            document.getElementById('prevBtn').disabled = (currentIndex === 0);
            document.getElementById('nextBtn').disabled = (currentIndex === radarImages.length - 1);
            
            const spinner = document.getElementById('loadingSpinner');
            if (spinner) spinner.style.display = 'none';
        }

        function prevImage() {
            if (currentIndex > 0) updateSingleDisplay(currentIndex - 1);
        }

        function nextImage() {
            if (currentIndex < radarImages.length - 1) updateSingleDisplay(currentIndex + 1);
        }

        function goToLatestImage() {
            if (isPlaying) togglePlayLoop();
            if (radarImages.length > 0) updateSingleDisplay(radarImages.length - 1);
        }

        function onSliderChange(val) {
            if (isPlaying) togglePlayLoop();
            updateSingleDisplay(val);
        }

        function togglePlayLoop() {
            const playIcon = document.getElementById('playIcon');
            const playText = document.getElementById('playText');

            if (isPlaying) {
                isPlaying = false;
                playIcon.className = "fa-solid fa-play";
                playText.innerText = "เล่นวิดีโอ Loop ย้อนหลัง";
                clearInterval(playInterval);
            } else {
                isPlaying = true;
                playIcon.className = "fa-solid fa-pause";
                playText.innerText = "หยุดเล่น";

                const startFrame = Math.max(0, radarImages.length - 12);
                currentIndex = startFrame;

                playInterval = setInterval(() => {
                    currentIndex++;
                    if (currentIndex >= radarImages.length) {
                        currentIndex = startFrame;
                    }
                    updateSingleDisplay(currentIndex);
                }, 800);
            }
        }

        function renderGridView() {
            const gallery = document.getElementById('gridGallery');
            gallery.innerHTML = radarImages.map((img, idx) => `
                <div onclick="selectImageFromGrid(${idx})" class="cursor-pointer border border-slate-200 rounded-2xl overflow-hidden bg-white hover:ring-4 hover:ring-blue-500/20 hover:border-blue-500 transition duration-200 shadow-sm hover:shadow-md group">
                    <div class="relative bg-slate-900 flex items-center justify-center p-1 min-h-[200px]">
                        <img src="${img.url}" alt="${img.filename}" class="w-full h-auto object-contain max-h-[260px] group-hover:scale-105 transition duration-200">
                    </div>
                    <div class="p-3 bg-white border-t border-slate-100 text-xs text-center font-medium text-slate-700 font-mono truncate">
                        <i class="fa-regular fa-image text-blue-600 mr-1"></i> ${img.filename}
                    </div>
                </div>
            `).join('');
        }

        function selectImageFromGrid(index) {
            switchView('single');
            updateSingleDisplay(index);
        }

        function switchView(mode) {
            const singleBox = document.getElementById('singleViewContainer');
            const gridBox = document.getElementById('gridViewContainer');
            const singleBtn = document.getElementById('viewSingleBtn');
            const gridBtn = document.getElementById('viewGridBtn');

            if (mode === 'single') {
                singleBox.classList.remove('hidden');
                gridBox.classList.add('hidden');
                singleBtn.className = "px-3 py-1.5 bg-white text-blue-700 text-xs font-semibold rounded-lg shadow-sm transition";
                gridBtn.className = "px-3 py-1.5 text-white hover:bg-white/10 text-xs font-medium rounded-lg transition";
            } else {
                if (isPlaying) togglePlayLoop();
                singleBox.classList.add('hidden');
                gridBox.classList.remove('hidden');
                gridBtn.className = "px-3 py-1.5 bg-white text-blue-700 text-xs font-semibold rounded-lg shadow-sm transition";
                singleBtn.className = "px-3 py-1.5 text-white hover:bg-white/10 text-xs font-medium rounded-lg transition";
            }
        }

        document.addEventListener('keydown', (e) => {
            const singleBox = document.getElementById('singleViewContainer');
            if (!singleBox.classList.contains('hidden')) {
                if (e.key === 'ArrowLeft') prevImage();
                if (e.key === 'ArrowRight') nextImage();
            }
        });

        document.getElementById('latestBtn').onclick = fetchRealtimeLatestImage;

        // เริ่มต้นการทำงานเมื่อเปิดหน้าเว็บ
        document.addEventListener('DOMContentLoaded', async () => {
            // 1. ตั้งค่าดีฟอลต์เลือกสถานีสัตหีบ
            document.getElementById('stationSelect').value = 'sattahip';

            // 2. ตั้งค่า Date Picker เป็นวันปัจจุบัน
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            document.getElementById('datePicker').value = `${year}-${month}-${day}`;

            // 3. โหลดข้อมูลประจำวัน และดึงภาพ Real-time ล่าสุดแสดงทันที
            await loadRadarData();
            fetchRealtimeLatestImage();
        });
    </script>
</body>
</html>
