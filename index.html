<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>thradar - ระบบติดตามภาพเรดาร์ฝนหลวง</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <header class="bg-blue-900 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-lg md:text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-satellite-dish text-sky-400"></i> thradar
            </h1>
            <div class="flex items-center gap-2">
                <button id="viewSingleBtn" onclick="switchView('single')" class="px-3 py-1 bg-blue-700 rounded text-xs font-medium border border-blue-400 text-white">
                    <i class="fa-solid fa-image"></i> ดูภาพเดี่ยว
                </button>
                <button id="viewGridBtn" onclick="switchView('grid')" class="px-3 py-1 bg-blue-900 rounded text-xs font-medium text-slate-300">
                    <i class="fa-solid fa-border-all"></i> ดูกริด
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-3 sm:p-4 space-y-4">
        <div class="bg-white rounded-xl p-3 shadow-sm border border-slate-200 grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">สถานีเรดาร์</label>
                <select id="stationSelect" onchange="loadRadarData()" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm">
                    <option value="sattahip">สัตหีบ</option>
                    <option value="omkoi">อมก๋อย</option>
                    <option value="phnom">พนม</option>
                    <option value="takli">ตาคลี</option>
                    <option value="phimai">พิมาย</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">เลือกวันที่ดูย้อนหลัง</label>
                <input type="date" id="datePicker" onchange="loadRadarData()" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm">
            </div>
        </div>

        <div id="singleViewContainer" class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-3 bg-slate-50 border-b border-slate-200 flex justify-between items-center text-xs text-slate-600">
                <span><i class="fa-regular fa-clock text-blue-600 mr-1"></i> เวลา: <strong id="timeDisplay">กำลังโหลด...</strong></span>
                <span id="frameCounter" class="bg-slate-200 px-2 py-0.5 rounded text-xs">0 / 0</span>
            </div>

            <div class="relative bg-slate-900 flex items-center justify-center min-h-[350px]">
                <img id="radarImg" src="" alt="Radar Image" class="max-w-full h-auto object-contain">
                <div id="loadingSpinner" class="absolute inset-0 bg-slate-900/70 flex items-center justify-center text-white text-sm">
                    <i class="fa-solid fa-spinner fa-spin text-2xl mr-2"></i> กำลังดึงข้อมูล...
                </div>
            </div>

            <div class="p-3 bg-slate-50 border-t border-slate-200 space-y-3">
                <input type="range" id="timelineSlider" min="0" max="0" value="0" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
                <div class="flex justify-center items-center gap-3">
                    <button id="playBtn" onclick="togglePlayLoop()" class="px-5 py-2 rounded-full bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium flex items-center gap-2 shadow">
                        <i id="playIcon" class="fa-solid fa-play"></i>
                        <span id="playText">เล่นวิดีโอ Loop ย้อนหลัง 1 ชม.</span>
                    </button>
                </div>
            </div>
        </div>

        <div id="gridViewContainer" class="hidden bg-white rounded-xl p-4 shadow-sm border border-slate-200">
            <h2 class="text-sm font-bold text-slate-700 mb-3 flex items-center gap-2">
                <i class="fa-solid fa-border-all text-blue-600"></i> ภาพเรดาร์ทั้งหมดในวันที่เลือก
            </h2>
            <div id="gridGallery" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3"></div>
        </div>
    </main>

    <script>
        document.getElementById('datePicker').valueAsDate = new Date();

        let radarImages = [];
        let currentIndex = 0;
        let isPlaying = false;
        let playInterval = null;

        async function loadRadarData() {
            const station = document.getElementById('stationSelect').value;
            const selectedDate = document.getElementById('datePicker').value; // YYYY-MM-DD
            const [year, month, day] = selectedDate.split('-');
            const spinner = document.getElementById('loadingSpinner');
            if (spinner) spinner.style.display = 'flex';

            const username = window.location.hostname.split('.')[0];
            const dataRepo = `thradar-data-${year}`;
            const apiUrl = `https://api.github.com/repos/${username}/${dataRepo}/contents/radar-images/${station}/${year}/${month}/${day}`;

            try {
                const res = await fetch(apiUrl);
                if (res.ok) {
                    const data = await res.json();
                    radarImages = data
                        .filter(file => file.name.endsWith('.png'))
                        .map(file => ({ filename: file.name, url: file.download_url }));
                } else {
                    radarImages = [];
                }
            } catch (e) {
                radarImages = [];
            }

            if (radarImages.length === 0) {
                document.getElementById('timeDisplay').innerText = "ไม่พบภาพในวันที่เลือก";
                if (spinner) spinner.style.display = 'none';
                document.getElementById('gridGallery').innerHTML = '<p class="col-span-full text-center text-xs text-slate-400 py-6">ไม่มีข้อมูลภาพเรดาร์ในระบบ</p>';
                return;
            }

            document.getElementById('timelineSlider').max = radarImages.length - 1;
            currentIndex = radarImages.length - 1;
            updateSingleDisplay(currentIndex);
            renderGridView();
        }

        function updateSingleDisplay(index) {
            currentIndex = index;
            const item = radarImages[currentIndex];
            document.getElementById('radarImg').src = item.url;
            document.getElementById('timeDisplay').innerText = item.filename;
            document.getElementById('frameCounter').innerText = `${currentIndex + 1} / ${radarImages.length}`;
            document.getElementById('timelineSlider').value = currentIndex;
            document.getElementById('loadingSpinner').style.display = 'none';
        }

        function togglePlayLoop() {
            const playIcon = document.getElementById('playIcon');
            const playText = document.getElementById('playText');

            if (isPlaying) {
                isPlaying = false;
                playIcon.className = "fa-solid fa-play";
                playText.innerText = "เล่นวิดีโอ Loop ย้อนหลัง 1 ชม.";
                clearInterval(playInterval);
            } else {
                isPlaying = true;
                playIcon.className = "fa-solid fa-pause";
                playText.innerText = "หยุดเล่น";

                const startFrame = Math.max(0, radarImages.length - 10);
                currentIndex = startFrame;

                playInterval = setInterval(() => {
                    currentIndex++;
                    if (currentIndex >= radarImages.length) {
                        currentIndex = startFrame;
                    }
                    updateSingleDisplay(currentIndex);
                }, 400);
            }
        }

        function renderGridView() {
            const gallery = document.getElementById('gridGallery');
            gallery.innerHTML = radarImages.map((img, idx) => `
                <div onclick="selectImageFromGrid(${idx})" class="cursor-pointer border border-slate-200 rounded-lg overflow-hidden bg-slate-900 hover:ring-2 hover:ring-blue-500 transition">
                    <img src="${img.url}" alt="${img.filename}" class="w-full h-auto object-contain">
                    <div class="p-1.5 bg-slate-50 text-[10px] text-center text-slate-600 font-mono truncate">
                        ${img.filename}
                    </div>
                </div>
            `).join('');
        }

        function selectImageFromGrid(index) {
            switchView('single');
            updateSingleDisplay(index);
        }

        function switchView(mode) {
            const singleBox = document.getElementById('singleViewContainer');
            const gridBox = document.getElementById('gridViewContainer');
            const singleBtn = document.getElementById('viewSingleBtn');
            const gridBtn = document.getElementById('viewGridBtn');

            if (mode === 'single') {
                singleBox.classList.remove('hidden');
                gridBox.classList.add('hidden');
                singleBtn.className = "px-3 py-1 bg-blue-700 text-xs font-medium border border-blue-400 text-white rounded";
                gridBtn.className = "px-3 py-1 bg-blue-900 text-xs font-medium text-slate-300 rounded";
            } else {
                if (isPlaying) togglePlayLoop();
                singleBox.classList.add('hidden');
                gridBox.classList.remove('hidden');
                gridBtn.className = "px-3 py-1 bg-blue-700 text-xs font-medium border border-blue-400 text-white rounded";
                singleBtn.className = "px-3 py-1 bg-blue-900 text-xs font-medium text-slate-300 rounded";
            }
        }

        loadRadarData();
    </script>
</body>
</html>
