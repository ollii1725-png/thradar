<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ภาพเรดาร์ทั่วประเทศ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between">

    <div>
        <!-- Header Bar บีบความสูงกระชับ + เปลี่ยนไอคอนเป็น Radar -->
        <header class="bg-gradient-to-r from-blue-700 via-blue-600 to-cyan-600 text-white shadow-md sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 py-2.5 flex flex-wrap items-center justify-between gap-3">
                
                <!-- Logo & Title -->
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-white/20 backdrop-blur-md rounded-xl flex items-center justify-center shadow-inner border border-white/30 flex-shrink-0">
                        <i class="fa-solid fa-radar text-white text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-semibold tracking-tight text-white leading-tight">
                            ภาพเรดาร์ทั่วประเทศ
                        </h1>
                        <p class="text-[11px] text-blue-100 font-light opacity-90">
                            Thailand Royal Rainmaking Radar Tracker by Sumet Prapasathit
                        </p>
                    </div>
                </div>

                <!-- Header Actions View Switcher -->
                <div class="flex items-center gap-2">
                    <div class="flex items-center gap-1 bg-white/10 p-1 rounded-xl border border-white/20">
                        <button id="viewSingleBtn" onclick="switchView('single')" class="px-3 py-1 bg-white text-blue-700 text-xs font-medium rounded-lg shadow-sm transition">
                            <i class="fa-solid fa-image mr-1"></i> โหมดภาพเดี่ยว
                        </button>
                        <button id="viewGridBtn" onclick="switchView('grid')" class="px-3 py-1 text-white hover:bg-white/10 text-xs font-normal rounded-lg transition">
                            <i class="fa-solid fa-border-all mr-1"></i> โหมดตาราง
                        </button>
                    </div>
                </div>

            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-3">

            <!-- Controls Section Card (บีบ padding ให้กระชับ) -->
            <div class="bg-white rounded-xl p-3 border border-slate-200/80 mb-2.5 shadow-sm">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3 items-center">
                    
                    <div>
                        <label class="block text-[11px] font-medium text-slate-500 mb-1">
                            <i class="fa-solid fa-tower-cell text-blue-600 mr-1"></i> เลือกสถานีเรดาร์
                        </label>
                        <select id="stationSelect" onchange="onStationChange()" class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-lg px-3 py-1.5 text-xs font-medium focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
                            <option value="sattahip">สถานีสัตหีบ (ชลบุรี)</option>
                            <option value="omkoi">สถานีอมก๋อย (เชียงใหม่)</option>
                            <option value="phnom">สถานีพนม (สุราษฎร์ธานี)</option>
                            <option value="takli">สถานีตาคลี (นครสวรรค์)</option>
                            <option value="phimai">สถานีพิมาย (นครราชสีมา)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-[11px] font-medium text-slate-500 mb-1">
                            <i class="fa-regular fa-calendar-days text-blue-600 mr-1"></i> เลือกวันที่ดูย้อนหลัง
                        </label>
                        <input type="date" id="datePicker" onchange="loadRadarData()" class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-lg px-3 py-1.5 text-xs font-medium focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
                    </div>

                    <div class="flex items-end h-full pt-1 md:pt-0">
                        <button id="latestBtn" class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-medium py-1.5 px-3 rounded-lg text-xs transition flex items-center justify-center gap-1.5 shadow-sm shadow-blue-200">
                            <i class="fa-solid fa-rotate text-amber-300"></i> ดูภาพปัจจุบัน (Refresh)
                        </button>
                    </div>

                </div>
            </div>

            <!-- Notice Alert ข้อความปรับใหม่ -->
            <div class="bg-blue-50/80 border border-blue-100 rounded-lg px-3 py-1.5 mb-3 flex items-center gap-2 text-[11px] text-blue-800">
                <i class="fa-solid fa-circle-info text-blue-600 text-xs flex-shrink-0"></i>
                <span>วิดีโอ และภาพเรดาร์แบบตาราง อาจยังไม่เป็นปัจจุบัน หากต้องการดูภาพปัจจุบัน ให้กดปุ่ม Refresh เพื่อดูภาพปัจจุบัน</span>
            </div>

            <!-- Single View Container -->
            <div id="singleViewContainer" class="space-y-2.5">
                
                <!-- Radar Display Box (ปรับความสูงให้อยู่ในกรอบเต็มจอพอดี) -->
                <div class="bg-white border border-slate-200/80 rounded-xl p-2 relative flex items-center justify-center min-h-[380px] max-h-[calc(100vh-250px)] shadow-sm overflow-hidden">
                    
                    <!-- Loading Spinner -->
                    <div id="loadingSpinner" class="absolute inset-0 bg-white/90 z-10 flex flex-col items-center justify-center gap-2 backdrop-blur-sm">
                        <i class="fa-solid fa-circle-notch fa-spin text-blue-600 text-2xl"></i>
                        <span class="text-xs font-medium text-slate-600">กำลังประมวลผลภาพเรดาร์...</span>
                    </div>

                    <img id="radarImg" src="" alt="Radar Display" class="w-full h-auto max-h-[calc(100vh-270px)] object-contain rounded-lg">
                </div>

                <!-- Control Bar Card (บีบความสูงให้อยู่ในแถบเดียว) -->
                <div class="bg-white rounded-xl p-2.5 border border-slate-200/80 shadow-sm flex flex-col gap-2">
                    
                    <div class="flex items-center justify-between text-[11px] text-slate-500 font-mono">
                        <span id="timeDisplay" class="font-semibold text-slate-700 text-xs">กำลังโหลดข้อมูล...</span>
                        <span id="frameCounter" class="bg-slate-100 px-2 py-0.5 rounded text-slate-600 font-medium">0 / 0</span>
                    </div>

                    <input type="range" id="timelineSlider" min="0" max="0" value="0" oninput="onSliderChange(this.value)" class="w-full accent-blue-600 cursor-pointer h-1.5 bg-slate-100 rounded-lg">

                    <div class="flex flex-wrap items-center justify-center gap-2 pt-0.5">
                        <button id="prevBtn" onclick="prevImage()" class="px-3 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-medium transition disabled:opacity-40">
                            <i class="fa-solid fa-chevron-left mr-1"></i> ย้อนหลัง
                        </button>
                        
                        <button id="playBtn" onclick="togglePlayLoop()" class="px-5 py-1 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-medium transition flex items-center gap-1.5 shadow-sm shadow-blue-200">
                            <i id="playIcon" class="fa-solid fa-play"></i> <span id="playText">เล่นวิดีโอ Loop ย้อนหลัง</span>
                        </button>

                        <button id="nextBtn" onclick="nextImage()" class="px-3 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-medium transition disabled:opacity-40">
                            ถัดไป <i class="fa-solid fa-chevron-right ml-1"></i>
                        </button>
                    </div>

                </div>

            </div>

            <!-- Grid View Container -->
            <div id="gridViewContainer" class="hidden">
                <div id="gridGallery" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
                    <!-- JS will render grid items here -->
                </div>
            </div>

        </main>
    </div>

    <script>
        // กำหนดข้อความต่อท้ายไฟล์ (Suffix Pattern) ตามจริงของแต่ละสถานี
        const STATION_PATTERNS = {
            sattahip: "0300dBZ.cappi.png",
            omkoi:    "0200dBZ.cappi.png",
            phnom:    "0300dBZ.cappi.png",
            takli:    "0400dBZ.cappi.png",
            phimai:   "0400dBZ.cappi.png"
        };
        
        let radarImages = [];
        let currentIndex = 0;
        let isPlaying = false;
        let playInterval = null;

        // ฟังก์ชันโหลดข้อมูลภาพย้อนหลังสำหรับ Slider และ Grid
        async function loadRadarData() {
            const station = document.getElementById('stationSelect').value;
            const selectedDate = document.getElementById('datePicker').value;
            const [year, month, day] = selectedDate.split('-');
            const spinner = document.getElementById('loadingSpinner');
            if (spinner) spinner.style.display = 'flex';

            const username = window.location.hostname.split('.')[0] || "ollii1725-png";
            const dataRepo = `thradar-data-${station}`;
            const apiUrl = `https://api.github.com/repos/${username}/${dataRepo}/contents/radar-images/${station}/${year}/${month}/${day}`;

            try {
                const res = await fetch(apiUrl);
                if (res.ok) {
                    const data = await res.json();
                    radarImages = data
                        .filter(file => file.name.endsWith('.png'))
                        .map(file => ({ filename: file.name, url: file.download_url }));
                } else {
                    radarImages = [];
                }
            } catch (e) {
                radarImages = [];
            }

            if (radarImages.length === 0) {
                document.getElementById('timeDisplay').innerText = "ไม่พบภาพในวันที่เลือก";
                if (spinner) spinner.style.display = 'none';
                document.getElementById('gridGallery').innerHTML = '<p class="col-span-full text-center text-xs text-slate-400 py-10 bg-white rounded-xl border border-slate-200">ไม่มีข้อมูลภาพเรดาร์ในระบบประจำวันที่เลือก</p>';
                document.getElementById('prevBtn').disabled = true;
                document.getElementById('nextBtn').disabled = true;
                return;
            }

            document.getElementById('timelineSlider').max = radarImages.length - 1;
            currentIndex = radarImages.length - 1;
            updateSingleDisplay(currentIndex);
            renderGridView();
        }

        // ฟังก์ชันคำนวณและดึงภาพ Real-time ล่าสุดตรงจากชื่อไฟล์
        async function fetchRealtimeLatestImage() {
            if (isPlaying) togglePlayLoop();
            const station = document.getElementById('stationSelect').value;
            const spinner = document.getElementById('loadingSpinner');
            if (spinner) spinner.style.display = 'flex';

            const suffix = STATION_PATTERNS[station] || "0300dBZ.cappi.png";

            // 1. คำนวณเวลา UTC ปัจจุบัน ย้อนเผื่อระบบต้นทางประมวลผล 3 นาที
            const now = new Date();
            now.setMinutes(now.getMinutes() - 3);

            // 2. ปัดนาทีเป็นทวีคูณของ 6
            const currentMinutes = now.getUTCMinutes();
            const roundedMinutes = Math.floor(currentMinutes / 6) * 6;

            // 3. ฟอร์แมต YYYYMMDD และ HHMM
            const year = now.getUTCFullYear();
            const month = String(now.getUTCMonth() + 1).padStart(2, '0');
            const day = String(now.getUTCDate()).padStart(2, '0');
            const hours = String(now.getUTCHours()).padStart(2, '0');
            const minutes = String(roundedMinutes).padStart(2, '0');

            const filename = `${year}${month}${day}${hours}${minutes}${suffix}`;
            const directImageUrl = `https://file.royalrain.go.th/opendata/radar_data/cappi/${station}/${filename}`;

            // 4. ทดสอบโหลดภาพ
            const imgTester = new Image();
            imgTester.onload = function() {
                document.getElementById('radarImg').src = directImageUrl;
                document.getElementById('timeDisplay').innerHTML = `<span class="text-emerald-600 font-semibold"><i class="fa-solid fa-circle text-[9px] text-emerald-500 mr-1"></i> [Real-time ล่าสุด]</span> ${filename}`;
                if (spinner) spinner.style.display = 'none';
            };
            
            imgTester.onerror = function() {
                // ถ้ารอบล่าสุดยังไม่พร้อม ให้ถอยกลับไปอีก 6 นาที
                now.setMinutes(now.getMinutes() - 6);
                const prevMinutes = String(Math.floor(now.getUTCMinutes() / 6) * 6).padStart(2, '0');
                const prevHours = String(now.getUTCHours()).padStart(2, '0');
                const prevFilename = `${year}${month}${day}${prevHours}${prevMinutes}${suffix}`;
                const prevImageUrl = `https://file.royalrain.go.th/opendata/radar_data/cappi/${station}/${prevFilename}`;

                document.getElementById('radarImg').src = prevImageUrl;
                document.getElementById('timeDisplay').innerHTML = `<span class="text-emerald-600 font-semibold"><i class="fa-solid fa-circle text-[9px] text-emerald-500 mr-1"></i> [Real-time ล่าสุด]</span> ${prevFilename}`;
                if (spinner) spinner.style.display = 'none';
            };

            imgTester.src = directImageUrl;
        }

        function onStationChange() {
            loadRadarData();
            fetchRealtimeLatestImage();
        }

        function updateSingleDisplay(index) {
            currentIndex = parseInt(index);
            const item = radarImages[currentIndex];
            document.getElementById('radarImg').src = item.url;
            document.getElementById('timeDisplay').innerText = item.filename;
            document.getElementById('frameCounter').innerText = `${currentIndex + 1} / ${radarImages.length}`;
            document.getElementById('timelineSlider').value = currentIndex;
            
            document.getElementById('prevBtn').disabled = (currentIndex === 0);
            document.getElementById('nextBtn').disabled = (currentIndex === radarImages.length - 1);
            
            const spinner = document.getElementById('loadingSpinner');
            if (spinner) spinner.style.display = 'none';
        }

        function prevImage() {
            if (currentIndex > 0) updateSingleDisplay(currentIndex - 1);
        }

        function nextImage() {
            if (currentIndex < radarImages.length - 1) updateSingleDisplay(currentIndex + 1);
        }

        function goToLatestImage() {
            if (isPlaying) togglePlayLoop();
            if (radarImages.length > 0) updateSingleDisplay(radarImages.length - 1);
        }

        function onSliderChange(val) {
            if (isPlaying) togglePlayLoop();
            updateSingleDisplay(val);
        }

        function togglePlayLoop() {
            const playIcon = document.getElementById('playIcon');
            const playText = document.getElementById('playText');

            if (isPlaying) {
                isPlaying = false;
                playIcon.className = "fa-solid fa-play";
                playText.innerText = "เล่นวิดีโอ Loop ย้อนหลัง";
                clearInterval(playInterval);
            } else {
                isPlaying = true;
                playIcon.className = "fa-solid fa-pause";
                playText.innerText = "หยุดเล่น";

                const startFrame = Math.max(0, radarImages.length - 12);
                currentIndex = startFrame;

                playInterval = setInterval(() => {
                    currentIndex++;
                    if (currentIndex >= radarImages.length) {
                        currentIndex = startFrame;
                    }
                    updateSingleDisplay(currentIndex);
                }, 800);
            }
        }

        function renderGridView() {
            const gallery = document.getElementById('gridGallery');
            gallery.innerHTML = radarImages.map((img, idx) => `
                <div onclick="selectImageFromGrid(${idx})" class="cursor-pointer border border-slate-200 rounded-xl overflow-hidden bg-white hover:ring-2 hover:ring-blue-500/30 hover:border-blue-500 transition duration-150 shadow-sm hover:shadow group">
                    <div class="relative bg-white flex items-center justify-center p-1 min-h-[180px]">
                        <img src="${img.url}" alt="${img.filename}" class="w-full h-auto object-contain max-h-[220px] group-hover:scale-105 transition duration-150">
                    </div>
                    <div class="p-2 bg-slate-50 border-t border-slate-100 text-[11px] text-center font-medium text-slate-700 font-mono truncate">
                        <i class="fa-regular fa-image text-blue-600 mr-1"></i> ${img.filename}
                    </div>
                </div>
            `).join('');
        }

        function selectImageFromGrid(index) {
            switchView('single');
            updateSingleDisplay(index);
        }

        function switchView(mode) {
            const singleBox = document.getElementById('singleViewContainer');
            const gridBox = document.getElementById('gridViewContainer');
            const singleBtn = document.getElementById('viewSingleBtn');
            const gridBtn = document.getElementById('viewGridBtn');

            if (mode === 'single') {
                singleBox.classList.remove('hidden');
                gridBox.classList.add('hidden');
                singleBtn.className = "px-3 py-1 bg-white text-blue-700 text-xs font-medium rounded-lg shadow-sm transition";
                gridBtn.className = "px-3 py-1 text-white hover:bg-white/10 text-xs font-normal rounded-lg transition";
            } else {
                if (isPlaying) togglePlayLoop();
                singleBox.classList.add('hidden');
                gridBox.classList.remove('hidden');
                gridBtn.className = "px-3 py-1 bg-white text-blue-700 text-xs font-medium rounded-lg shadow-sm transition";
                singleBtn.className = "px-3 py-1 text-white hover:bg-white/10 text-xs font-normal rounded-lg transition";
            }
        }

        document.addEventListener('keydown', (e) => {
            const singleBox = document.getElementById('singleViewContainer');
            if (!singleBox.classList.contains('hidden')) {
                if (e.key === 'ArrowLeft') prevImage();
                if (e.key === 'ArrowRight') nextImage();
            }
        });

        document.getElementById('latestBtn').onclick = fetchRealtimeLatestImage;

        // เริ่มต้นการทำงานเมื่อเปิดหน้าเว็บ
        document.addEventListener('DOMContentLoaded', async () => {
            // 1. ตั้งค่าดีฟอลต์เลือกสถานีสัตหีบ
            document.getElementById('stationSelect').value = 'sattahip';

            // 2. ตั้งค่า Date Picker เป็นวันปัจจุบัน
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            document.getElementById('datePicker').value = `${year}-${month}-${day}`;

            // 3. โหลดข้อมูลประจำวัน และดึงภาพ Real-time ล่าสุดแสดงทันที
            await loadRadarData();
            fetchRealtimeLatestImage();
        });
    </script>
</body>
</html>
