name: Auto Fetch & Sync Radar Images

on:
  schedule:
    - cron: "*/15 * * * *" # สั่งรันอัตโนมัติทุกๆ 15 นาที
  workflow_dispatch:

jobs:
  fetch-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow

      - name: Run Scraper Script (Keep 24h)
        run: python fetch_radar.py

      - name: Sync Images to Station Repositories
        run: |
          STATIONS=("sattahip" "omkoi" "phanom" "takhli" "phimai" "rongkwang")
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          for STN in "${STATIONS[@]}"; do
            echo "--- Processing Station: $STN ---"
            
            # Checkout Station Repo
            git clone "https://x-access-token:${{ secrets.DATA_REPO_TOKEN }}@github.com/${{ github.repository_owner }}/thradar-data-${STN}.git" "repo-${STN}" || continue
            
            # Clear old and copy new 24h images
            rm -rf "repo-${STN}/radar-images/${STN}"
            mkdir -p "repo-${STN}/radar-images/${STN}"
            
            if [ -d "radar-images/${STN}" ]; then
              cp -r "radar-images/${STN}/"* "repo-${STN}/radar-images/${STN}/" 2>/dev/null || true
            fi
            
            # Push changes to Station Repo
            cd "repo-${STN}"
            git add -A radar-images/
            git diff --staged --quiet || (git commit -m "Auto sync 24h radar images for ${STN}" && git push)
            cd ..
            
            rm -rf "repo-${STN}"
          done
